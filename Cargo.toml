[package]
name = "eyonexis-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serveur HTTP
axum = "0.8.9"

# Runtime asynchrone
tokio = { version = "1", features = ["full"] }

# Base de données (SQL pur avec vérification)
sqlx = { version = "0.8.6", features = ["chrono", "postgres", "runtime-tokio", "uuid", "json", "macros"] }

# JSON (sérialisation/désérialisation)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# .env
dotenvy = "0.15"
chrono = { version = "0.4.44", features = ["serde"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sqlparser = "0.62"
axum-macros = "0.5.1"
sha2 = "0.11.0"
hex = "0.4.3"
slug = "0.1.6"
capitalize = "0.3.4"
listenfd = "0.2"  # ou la version la plus récente
